[package]
name = "fieldguide-core"
description = "Field Guide data model, storage, search, and backups"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "fieldguide_core"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
# The bundled SQLite is compiled with FTS5; there is no separate feature for it.
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = "1"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
