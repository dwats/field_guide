[package]
name = "fieldguide-core"
description = "Field Guide data model, storage, search, and backups"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "fieldguide_core"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
deunicode = "1"
dirs = "7"
# Free space on the vault's drive, for the low-disk notice. Pure Rust (rustix), no libc.
fs4 = "1"
# Decoding dropped and pasted images and encoding lossless WebP. Pure Rust; no libwebp.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
# Markdown parser used by rustdoc and mdBook. `html` is the renderer; `getopts` is only for its CLI.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# The bundled SQLite is compiled with FTS5; there is no separate feature for it.
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
thiserror = { workspace = true }
toml = "1"
uuid = { version = "1", features = ["v7"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
