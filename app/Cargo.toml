[package]
name = "fieldguide"
description = "Field Guide desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fieldguide"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = { workspace = true }
fieldguide-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
# `protocol-asset` serves vault media to the webview; the scope is set at runtime to `media/`.
# Pinned to the minor: `webview2-com` below must stay the version this Tauri's wry uses, and a
# minor Tauri release may move it.
tauri = { version = "2.11", features = ["protocol-asset"] }
# Hands a web link from an entry body to the system browser (ShellExecuteW on Windows, no command
# line). Called from Rust only: the plugin is not registered, so the webview gets none of its
# commands and none of its link-click script.
tauri-plugin-opener = "2"
# A second launch focuses the running window instead of opening a second writer.
tauri-plugin-single-instance = "2"

# The WebView2 settings object, to turn off the browser's own accelerator keys (F5 reloads,
# Ctrl+P prints) so the app owns its keyboard. Same versions wry uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
